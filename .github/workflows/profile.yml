# Regenerates the org profile assets (banner + live numbers) in profile/ and commits them.
name: profile
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/profile_*.py", "scripts/ecosystem.py"]
permissions: {contents: write}
concurrency: {group: profile, cancel-in-progress: true}
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install fonttools
      - run: python3 scripts/profile_banner.py profile && python3 scripts/ecosystem.py profile && python3 scripts/profile_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --cached --quiet || (git commit -m "chore(profile): refresh profile assets" && git push)
