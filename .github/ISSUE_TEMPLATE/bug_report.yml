name: Bug report
description: Something does not work as expected
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes: {label: "What happened?", description: "What you did, what you expected, what you got."}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
  - type: input
    id: version
    attributes: {label: Version, description: "Launcher version, mod version, or commit."}
  - type: textarea
    id: logs
    attributes: {label: Logs or screenshots, description: "Remove tokens and personal data first (launcher_log.txt may contain them).", render: text}
