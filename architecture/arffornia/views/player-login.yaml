apiVersion: noodle/v1alpha1
kind: View
type: sequence
title: "Arffornia · Player login · From Play to the server"
subtitle: "What happens between a player pressing Play in the launcher and the server knowing their progression."
meta:
  - "Scope: Arffornia_Launcher_V.5.2@215a845 (msAuthManager.js, minecraftManager.js), msmc 5.0.5, Velocity config in Provisioning@235d0b8, Arffornia_Mods@a72e114 (Arffornia.onPlayerJoin) · derived from code, 2026-10-29"
  - "First login shown; with a saved refresh token msmc refreshes instead of opening the Microsoft window. Java, NeoForge and mod sync are collapsed into one note (view content-delivery)."
  - "Inferred, not in Arffornia code: the client's session join and Velocity's hasJoined (standard online-mode protocol, onlineMode: true in infra proxy values). The ensure-exists call goes out to the public IP and back through the router to Envoy (G3); the router hop of that hairpin is not drawn."
  - "v0.1 · source: architecture/arffornia/views/player-login.yaml"

participants: [player, launcher, ms-login, xbox-live, mc-services, mojang-session, mc-client, router, velocity, arcane, envoy, website]

steps:
  - {id: play, from: player, to: launcher, over: c-player-launcher, text: "Play"}
  - {note: launcher, text: "no refresh token saved"}
  - {id: oauth, from: launcher, to: ms-login, over: c-launcher-mslogin, text: "OAuth window (msmc, client 00000000402b5328)"}
  - {note: ms-login, text: "player signs in"}
  - {reply: oauth, text: "code, then MS access + refresh token"}
  - {id: xbl, from: launcher, to: xbox-live, over: c-launcher-xbox, text: "XBL user token, then XSTS"}
  - {reply: xbl, text: "XSTS token + user hash"}
  - {id: mclogin, from: launcher, to: mc-services, over: c-launcher-mcservices, text: "login_with_xbox, entitlements, profile"}
  - {reply: mclogin, text: "MC access token, UUID, name"}
  - {note: launcher, text: "save refresh token (nexus_saver) · Java, NeoForge, mod sync"}
  - {id: spawn, from: launcher, to: mc-client, over: c-launcher-client, text: "spawn java · MCLC, token in args"}
  - {id: join, from: mc-client, to: mojang-session, over: c-client-session, text: "session join (server id)"}
  - {id: connect, from: mc-client, to: router, over: c-client-router, text: "connect arffornia.com:25565"}
  - {id: dnat, from: router, to: velocity, over: c-router-velocity, text: "port-forward to the Velocity VIP"}
  - {id: hasjoined, from: velocity, to: mojang-session, over: c-velocity-session, text: "hasJoined (online-mode)"}
  - {reply: hasjoined, text: "profile + skin"}
  - {id: forward, from: velocity, to: arcane, over: c-velocity-arcane, text: "login + modern forwarding (secret, UUID, IP)"}
  - {note: arcane, text: "online-mode=false: trusts the forwarding secret · PlayerLoggedInEvent"}
  - {id: ensure, from: arcane, to: envoy, over: c-arcane-envoy, text: "POST /api/player/ensure-exists · Bearer"}
  - {id: ensure-r, from: envoy, to: website, over: c-envoy-website}
  - {reply: ensure-r, text: "200"}
  - {reply: ensure}
  - {id: stages, from: arcane, to: envoy, over: c-arcane-envoy, text: "GET /api/stages/player/get/{uuid}"}
  - {id: stages-r, from: envoy, to: website, over: c-envoy-website}
  - {reply: stages-r, text: "graph + current target"}
  - {reply: stages}
  - {id: milestone, from: arcane, to: envoy, over: c-arcane-envoy, text: "GET /api/milestone/get/{target}"}
  - {id: milestone-r, from: envoy, to: website, over: c-envoy-website}
  - {reply: milestone-r, text: "milestone name"}
  - {reply: milestone}
  - {note: arcane, text: "send target to the client HUD · tell the player if rewards are pending"}
  - {reply: dnat}
  - {reply: connect, text: "in game"}
