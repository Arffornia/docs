annotations:
  - {id: G1, severity: medium, title: "Website not behind Cloudflare",
     text: "The audit draws browsers → Cloudflare → Envoy. In terraform/dns.tf the apex arffornia.com is an A record with proxied = false: the site and API are reached directly on dc_ip. Only map, www, vault, argocd… are proxied.",
     targets: [c-browser-router]}
  - {id: G2, severity: high, title: "Server writes the website DB",
     text: "The mod opens JDBC to postgres-cluster (db arffornia) and runs pending_rewards.commands as console commands. Website and game share a schema and a trust boundary.",
     targets: [c-arcane-postgres]}
  - {id: G3, severity: medium, title: "API hairpins via the public IP",
     text: "Server and proxy call https://arffornia.com/api; the apex resolves to dc_ip, so in-cluster calls leave through the router (NAT loopback) and come back to Envoy.",
     targets: [c-arcane-envoy, c-velocity-envoy]}
  - {id: G4, severity: high, title: "Secrets: one operator identity",
     text: "VSO reads https://vault.arffornia.com (proxied by Cloudflare) with one ServiceAccount bound to every Vault role: any VaultSecret in any namespace can read any Arffornia secret.",
     targets: [c-vso-vault]}
  - {id: G5, severity: medium, title: "No NetworkPolicy",
     text: "RCON 25575, game 25565 (online-mode=false, forwarding secret only), metrics and BlueMap live are reachable from every pod. Postgres also has a LAN LoadBalancer.",
     targets: [arcane]}
  - {id: G6, severity: low, title: "Alerting gaps",
     text: "ServiceMonitor scrapes every 5 s. CriticalServiceDown watches job arffornia-proxy-velocity and ingress-nginx, neither of which is scraped.",
     targets: [prometheus]}
  - {id: G7, severity: low, title: "Old repo URL",
     text: "BASE_URL (config-updater) and JSON_MOD_LIST_URL (launcher) still point at Arffornia/Arffornia_Network and work only through GitHub's rename redirect.",
     targets: [c-updater-provisioning, c-launcher-provisioning]}
  - {id: G8, severity: high, title: "Failed lookups delete mods",
     text: "Nexus_Mods logs a failed lookup or download, then deletes every jar not resolved and exits 0. A curse.tools hiccup boots a server or a player with mods missing.",
     targets: [config-updater, launcher]}
  - {id: G9, severity: medium, title: "No versioning",
     text: "main of Provisioning is production for every server and launcher, and the mod and proxy jars are pinned to tag latest. config-updater and website images are :latest.",
     targets: [provisioning-repo, gh-releases]}
  - {id: G10, severity: medium, title: "Third-party CurseForge proxy",
     text: "CurseForge metadata and download URLs come from api.curse.tools, not the official API.",
     targets: [curse-tools]}
  - {id: G11, severity: medium, title: "Unverified downloads",
     text: "Java (Azul) and the NeoForge installer are downloaded with no checksum; mod hashes are only checked on files already present.",
     targets: [c-launcher-azul, c-launcher-neoforge]}
  - {id: G12, severity: high, title: "Committed service credentials",
     text: "Arffornia_Proxy ships nuvotifier_service client id and secret in its default config.properties, in git since the first commit: anyone can mint a token and forge votes.",
     targets: [c-velocity-envoy]}
